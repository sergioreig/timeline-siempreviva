<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roca+One&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f5f5f5;
            color: #002f6c;
            overflow: hidden;
        }

        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
            gap: 20px;
            overflow: visible;
        }

        /* Timeline Principal */
        .timeline-wrapper {
            width: 100%;
            height: 75vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: visible;
            padding-right: 50px;
            padding-left: 50px;
        }

        .timeline-scroll {
            width: 100%;
            height: 100%;
            overflow-x: scroll;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
        }

        .timeline-scroll::-webkit-scrollbar {
            display: none;
        }

        .timeline-inner {
            display: flex;
            gap: 50px;
            padding: 0 100px;
            height: 100%;
            align-items: center;
            min-width: min-content;
        }

        .timeline-item {
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: all 1.0s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 0;
            overflow: visible !important;
            z-index: 10;
        }

        .timeline-item.size-large {
            width: 320px;
            height: 450px;
        }

        .timeline-item.size-small {
            width: 240px;
            height: 340px;
        }

        /* ESTADO HOVER - Se amplia la imagen y se desplazan las demás */
        .timeline-item:hover,
        .timeline-item.active-hover {
            width: 520px;
            height: 580px;
            z-index: 50;
        }

        .timeline-item:hover ~ .timeline-item,
        .timeline-item.active-hover ~ .timeline-item {
            margin-left: 400px;
            filter: blur(1px);
        }

        .image-card {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .timeline-item:hover .image-card {
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Info panel - aparece al hacer hover */
        .year-info {
            position: absolute;
            left: 100%;
            top: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            width: 300px;
            padding: 0 0 0 15px;
            white-space: normal;
            transform: translateY(-50%) translateX(-10px);
        }

        .timeline-item:hover .year-info,
        .timeline-item.active-hover .year-info {
            opacity: 1;
            transform: translateY(-50%) translateX(10px);
            pointer-events: auto;
        }

        .year-display {
            font-family: 'Roca One', serif;
            font-size: 6rem;
            font-weight: 300;
            color: #00c2df;
            line-height: 0.9;
            letter-spacing: -2px;
            margin-bottom: 20px;
            margin-left: 20px;
        }

        .year-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #002f6c;
            font-weight: 400;
            margin-left: 20px;
        }

        /* Índice de Años */
        .year-index {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .year-btn {
            font-family: 'Roca One', serif;
            font-size: 1.1rem;
            color: #999;
            background: none;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            font-weight: 300;
        }

        .year-btn:hover {
            color: #00c2df;
            background: rgba(0, 194, 223, 0.08);
        }

        .year-btn.active {
            color: #00c2df;
            background: rgba(0, 194, 223, 0.15);
            font-weight: 400;
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            background: #ddd;
            border-radius: 50%;
            margin: 0 2px;
        }

        @media (max-width: 1024px) {
            .timeline-wrapper {
                height: 450px;
            }

            .timeline-item:hover {
                width: 380px;
                height: 420px;
            }

            .timeline-item:hover ~ .timeline-item {
                margin-left: 150px;
            }

            .year-info {
                right: -200px;
                width: 250px;
                padding: 0 30px;
            }

            .year-display {
                font-size: 4rem;
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: 20px;
                gap: 30px;
            }

            .timeline-wrapper {
                height: 350px;
            }

            .timeline-item.size-large {
                width: 200px;
                height: 280px;
            }

            .timeline-item.size-small {
                width: 140px;
                height: 200px;
            }

            .timeline-item:hover ~ .timeline-item {
                margin-left: 200px;
            }

            .year-info {
                right: -200px;
                width: 200px;
                padding: 0 20px;
            }

            .year-display {
                font-size: 2.5rem;
                margin-bottom: 12px;
            }

            .year-description {
                font-size: 0.9rem;
            }

            .year-btn {
                font-size: 1rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Timeline -->
        <div class="timeline-wrapper">
            <div class="timeline-scroll" id="timelineScroll">
                <div class="timeline-inner" id="timelineInner"></div>
            </div>
        </div>

        <!-- Índice de Años -->
        <div class="year-index" id="yearIndex"></div>
    </div>

    <script>
        const events = [
            { year: '1928', title: 'Fundación', description: 'La Siempreviva inicia su actividad en Alicante, dando sus primeros pasos en los servicios funerarios.', size: 'large' },
            { year: '1959', title: 'Expansión', description: 'Comienza la actividad de La Nacional en Andalucía, ampliando la presencia en el sector.', size: 'small' },
            { year: '1984', title: 'Primer Tanatorio', description: 'La Siempreviva inaugura en Alicante su primer tanatorio, décimo a nivel nacional.', size: 'large' },
            { year: '1987', title: 'Crematorio Privado', description: 'Se pone en funcionamiento en Alicante el primer crematorio privado de España.', size: 'small' },
            { year: '1999', title: 'ISO 9001', description: 'La Siempreviva obtiene la certificación ISO 9001, siendo la primera empresa de servicios funerarios en Europa.', size: 'large' },
            { year: '2000', title: 'Expansión Nacional', description: 'Se adquiere el Tanatorio-Crematorio de Alfafar en Valencia, primera inversión fuera de Alicante.', size: 'small' },
            { year: '2014', title: 'Mercado Global', description: 'Grupo Asv adquiere SCI Alemania, perteneciente a SCI USA, principal operador en EE. UU.', size: 'large' },
            { year: '2016', title: 'Servicios Centrales', description: 'Se inauguran los Servicios Centrales en el Edificio Asv de Alicante.', size: 'small' },
            { year: '2017', title: 'Mercado Latinoamericano', description: 'Asv Servicios Funerarios adquiere parte del Grupo Recordar en Colombia, avanzando en su presencia internacional.', size: 'large' },
            { year: '2022', title: 'USA', description: 'Entramos en el mercado estadounidense con la adquisición de Cremations & Funerals en Atlanta, Georgia.', size: 'small' },
            { year: '2026', title: 'Nueva Etapa', description: 'Evolucionamos nuestra identidad para adaptarnos a una nueva etapa de crecimiento y transformación.', size: 'large' }
        ];

        const images = [
            'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=500&fit=crop',
            'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=500&h=500&fit=crop'
        ];

        const timelineInner = document.getElementById('timelineInner');
        const yearIndex = document.getElementById('yearIndex');
        const timelineScroll = document.getElementById('timelineScroll');
        const timelineItems = [];
        let isAnimating = false;

        // Crear items del timeline
        events.forEach((event, index) => {
            const item = document.createElement('div');
            item.className = `timeline-item size-${event.size}`;
            item.dataset.index = index;

            item.innerHTML = `
                <div class="image-card">
                    <img src="${images[index]}" alt="${event.title}" loading="lazy">
                </div>
                <div class="year-info">
                    <div class="year-display">${event.year}</div>
                    <div class="year-description">${event.description}</div>
                </div>
            `;

            timelineInner.appendChild(item);
            timelineItems.push(item);

            // Centrar imagen al hacer hover
            item.addEventListener('mouseenter', () => {
                const index = parseInt(item.dataset.index);
                goToYear(index, true);
            });

            // Remover active-hover al salir del item (solo si no está en hover CSS)
            item.addEventListener('mouseleave', () => {
                // Solo remover si no estamos haciendo hover actualmente
                setTimeout(() => {
                    if (!item.matches(':hover')) {
                        item.classList.remove('active-hover');
                    }
                }, 0);
            });
        });

        // Crear índice de años
        events.forEach((event, index) => {
            const btn = document.createElement('button');
            btn.className = 'year-btn';
            if (index === 0) btn.classList.add('active');
            btn.textContent = event.year;
            btn.onclick = () => {
                goToYear(index, true);
            };

            yearIndex.appendChild(btn);

            if (index < events.length - 1) {
                const dot = document.createElement('div');
                dot.className = 'divider-dot';
                yearIndex.appendChild(dot);
            }
        });

        // Función para ir a un año
        function goToYear(index, shouldActivateHover = false) {
            // Evitar múltiples animaciones simultáneas
            if (isAnimating) return;

            isAnimating = true;

            const item = timelineItems[index];
            const itemCenter = item.offsetLeft + item.offsetWidth / 2;
            const scrollCenter = timelineScroll.clientWidth / 2;
            const scrollPos = itemCenter - scrollCenter - 100;

            // Calcular duración basada en la distancia de forma más suave
            const currentScroll = timelineScroll.scrollLeft;
            const distance = Math.abs(scrollPos - currentScroll);
            const baseDuration = 1.5;
            // Solo acelera si la distancia es muy grande (años muy separados)
            const additionalDuration = distance > 400 ? Math.min((distance - 400) / 1500, 0.6) : 0;
            const duration = baseDuration + additionalDuration;

            if (shouldActivateHover) {
                activateItemHover(index);
            }

            // Matar animaciones previas
            gsap.killTweensOf(timelineScroll);

            gsap.to(timelineScroll, {
                scrollLeft: scrollPos,
                duration: duration,
                ease: 'power2.inOut',
                overwrite: 'auto',
                onComplete: () => {
                    isAnimating = false;
                }
            });
            updateActiveYear(index);
        }

        // Actualizar año activo
        function updateActiveYear(index) {
            document.querySelectorAll('.year-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        // Activar efecto hover en el item
        function activateItemHover(index) {
            // Remover active-hover de todos primero
            timelineItems.forEach((item) => {
                item.classList.remove('active-hover');
            });
            // Luego agregar solo al item deseado
            timelineItems[index].classList.add('active-hover');
        }

        // Actualizar índice al hacer scroll
        timelineScroll.addEventListener('scroll', () => {
            const scrollCenter = timelineScroll.scrollLeft + timelineScroll.clientWidth / 3;
            let closest = 0;
            let minDist = Infinity;

            timelineItems.forEach((item, index) => {
                const itemLeft = item.offsetLeft;
                const dist = Math.abs(scrollCenter - itemLeft);
                if (dist < minDist) {
                    minDist = dist;
                    closest = index;
                }
            });

            updateActiveYear(closest);
        }, { passive: true });

        // Scroll con rueda
        timelineScroll.addEventListener('wheel', (e) => {
            e.preventDefault();
            timelineScroll.scrollLeft += e.deltaY * 0.5;
        }, { passive: false });
    </script>
</body>
</html>
